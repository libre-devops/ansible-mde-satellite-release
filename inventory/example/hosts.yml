---
# Example inventory. `just init` copies this directory to inventory/local (git-ignored), which
# ansible.cfg uses. Edit the copy, never this one. Every name and address here is made up.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    # The test VMs, one per RHEL version being released. Add them by hand after building them,
    # or let `just provision` write them to a file in this directory.
    release_test:
      hosts:
        el8-test.example.com:
        el9-test.example.com:
